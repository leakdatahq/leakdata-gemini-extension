name: Validate extension

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - run: npm install --global --ignore-scripts npm@11.16.0
      - run: npm test
      - run: npx --yes @google/gemini-cli@0.59.0 extensions validate .
      - name: Validate Antigravity plugin
        shell: bash
        run: |
          curl -fsSL -o /tmp/agy.tar.gz https://storage.googleapis.com/antigravity-public/antigravity-cli/1.1.28-5576113066475520/linux-x64/cli_linux_x64.tar.gz
          echo "a855c623426fe901088bfe2b4d559b01f5b479a7c5ec0e41acfe129d4fe7deee9fbd9057072cc8e8c19ed65474cafa4f1d10fcdc14fbb85f82f20c3ec94295d4  /tmp/agy.tar.gz" | sha512sum -c -
          tar -xzf /tmp/agy.tar.gz -C /tmp antigravity
          chmod +x /tmp/antigravity
          /tmp/antigravity plugin validate .
